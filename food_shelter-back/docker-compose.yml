services:
  db:
    image: postgres:15
    container_name: recipebox_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipeboxpass}
      POSTGRES_DB: ${POSTGRES_DB:-recipebox}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
volumes:
  db_data:

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "172.28.0.0/16"